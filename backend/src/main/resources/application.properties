spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sunbank}
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Carteira Ethereum (testnet Sepolia)
ethereum.rpc-url=${ETH_RPC_URL:https://ethereum-sepolia-rpc.publicnode.com}
ethereum.chain-id=${ETH_CHAIN_ID:11155111}
wallet.encryption-secret=${WALLET_SECRET:altere-esta-chave-em-producao}

# Configuracoes de venda ETH -> BRL na exchange
exchange.deposit-address=${EXCHANGE_DEPOSIT_ADDRESS:}
exchange.eth-brl-rate=${EXCHANGE_ETH_BRL_RATE:10000.00}
exchange.fee-percent=${EXCHANGE_FEE_PERCENT:0.00}
exchange.price-api-url=${EXCHANGE_PRICE_API_URL:https://api.binance.com/api/v3/ticker/price?symbol=ETHBRL}
