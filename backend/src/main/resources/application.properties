spring.application.name=backend
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sunbank
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Blockchain
sunbank.blockchain.enabled=true
sunbank.blockchain.rpc-url=http://localhost:8545
sunbank.blockchain.private-key=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
sunbank.blockchain.contract-address=0x5FbDB2315678afecb367f032d93F642f64180aa3
sunbank.blockchain.gas-limit=100000
sunbank.blockchain.encryption-key=sunbank-wallet-key-2024

# Banco do Brasil API integration (requires official credentials and environment)
sunbank.bancodobrasil.enabled=false
sunbank.bancodobrasil.api-url=${BB_API_URL:}
sunbank.bancodobrasil.oauth-token-url=${BB_OAUTH_TOKEN_URL:}
sunbank.bancodobrasil.client-id=${BB_CLIENT_ID:}
sunbank.bancodobrasil.client-secret=${BB_CLIENT_SECRET:}
sunbank.bancodobrasil.agencia-origem=${BB_AGENCIA_ORIGEM:}
sunbank.bancodobrasil.conta-origem=${BB_CONTA_ORIGEM:}
sunbank.bancodobrasil.conta=${BB_CONTA:}
