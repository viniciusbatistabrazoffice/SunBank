name: CI/CD com Docker

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*', 'v*.*', 'v*']
  pull_request:
    branches: [main, master]

env:
  IMAGE_NAME: sunbank-backend

jobs:
  test:
    name: Testar e construir
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '16'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar testes com Maven
        run: ./mvnw -B test

      - name: Construir pacote
        run: ./mvnw -B package -DskipTests

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Definir tags da imagem
        id: meta
        run: |
          GHCR="ghcr.io/${{ github.repository_owner }}"
          IMAGE="${GHCR}/${{ env.IMAGE_NAME }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="latest"
          fi
          echo "image=${IMAGE}"
          echo "tag=${TAG}"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
