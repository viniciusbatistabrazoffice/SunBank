version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sunbank_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sunbank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sunbank"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: sunbank_backend
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sunbank
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
