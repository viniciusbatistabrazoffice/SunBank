services:
  db:
    image: postgres:16-alpine
    container_name: sunbank_db
    environment:
      POSTGRES_DB: sunbank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sunbank"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: sunbank_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sunbank
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin123
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
